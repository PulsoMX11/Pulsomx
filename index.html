<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoMX | Noticias de México y el mundo</title>
    <meta name="description" content="PulsoMX: resúmenes de las noticias más importantes de México y el mundo, actualizados cada hora, con enlace a la fuente original.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PulsoMX">
    <meta property="og:title" content="PulsoMX | Noticias de México y el mundo">
    <meta property="og:description" content="Resúmenes de las noticias más importantes de México y el mundo, actualizados cada hora.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/estilos.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2125166334282472" crossorigin="anonymous"></script>
    <script src="assets/comun.js"></script>
</head>
<body>
    <div id="bloqueo-overlay">
        <div id="bloqueo-card">
            <div id="bloqueo-icono">🛡️</div>
            <h2 id="bloqueo-titulo">Acceso bloqueado</h2>
            <p id="bloqueo-mensaje"></p>
            <div id="bloqueo-instrucciones-box"><p id="bloqueo-instrucciones"></p></div>
            <button type="button" id="btn-reintentar">Ya lo desactivé — Reintentar</button>
        </div>
    </div>

    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">⚡ PULSO<span>MX</span></a>
            <nav class="header-nav">
                <a href="index.html"><i class="fa-solid fa-house"></i> <span class="hide-xs">Inicio</span></a>
                <a href="acerca.html" class="hide-xs">Acerca de</a>
                <a href="contacto.html" class="hide-xs">Contacto</a>
            </nav>
        </div>
    </header>

    <div class="ahora"><div class="ahora-inner"><b>🔴 Ahora</b><span id="ahora-texto">Cargando titulares...</span></div></div>

    <div class="ad-top"><div data-anuncio="728"></div><div data-anuncio="320"></div></div>

    <div class="contenedor">
        <main>
            <p class="titulo-seccion">Titulares de hoy</p>
            <div class="pestanas" role="group" aria-label="Sección">
                <button type="button" data-seccion="todas" aria-pressed="true"><i class="fa-solid fa-newspaper"></i> Todas</button>
                <button type="button" data-seccion="mexico" aria-pressed="false"><i class="fa-solid fa-location-dot"></i> México</button>
                <button type="button" data-seccion="mundo" aria-pressed="false"><i class="fa-solid fa-earth-americas"></i> Mundo</button>
            </div>
            <div id="destacada">
                <div class="hero-card">
                    <div class="skeleton" style="height:clamp(180px,35vw,340px);"></div>
                    <div class="cuerpo">
                        <div class="skeleton" style="height:18px;width:70px;margin-bottom:10px;"></div>
                        <div class="skeleton" style="height:32px;margin-bottom:8px;"></div>
                        <div class="skeleton" style="height:14px;"></div>
                    </div>
                </div>
            </div>
            <div id="lista" class="news-grid"></div>
        </main>

        <aside class="sidebar">
            <div class="widget">
                <p class="widget-titulo">Lo más reciente</p>
                <div id="lateral"></div>
            </div>
            <div class="ad-sidebar" data-anuncio="300"></div>
        </aside>
    </div>

    <footer>
        <div class="footer-links">
            <a href="index.html">Inicio</a>
            <a href="privacidad.html">Política de privacidad</a>
            <a href="terminos.html">Términos de uso</a>
            <a href="contacto.html">Contacto</a>
            <a href="acerca.html">Acerca de</a>
        </div>
        <p>© <span id="anio">2026</span> PulsoMX — Resúmenes de noticias de México y el mundo.</p>
    </footer>

    <script>
        var todas = [];
        var e = Pulso.esc;
        var enlace = function (n) { return 'noticia.html?id=' + encodeURIComponent(n.id); };
        var etiqueta = function (n) {
            return '<span class="etiqueta-region' + (Pulso.seccionDe(n) === 'mundo' ? ' mundo' : '') + '">' + e(Pulso.etiquetaDe(n)) + '</span>';
        };

        function seccionActual() {
            var s = location.hash.replace('#', '');
            return s === 'mexico' || s === 'mundo' ? s : 'todas';
        }

        function pintar() {
            var seccion = seccionActual();
            document.querySelectorAll('.pestanas button').forEach(function (b) {
                b.setAttribute('aria-pressed', String(b.getAttribute('data-seccion') === seccion));
            });
            var noticias = seccion === 'todas' ? todas : todas.filter(function (n) { return Pulso.seccionDe(n) === seccion; });
            var destacada = document.getElementById('destacada');
            var cuadricula = document.getElementById('lista');
            if (!noticias.length) {
                destacada.innerHTML = '';
                cuadricula.innerHTML = '<p class="mensaje-vacio">' + (todas.length
                    ? 'Todavía no hay noticias en esta sección. El robot agrega nuevas cada hora.'
                    : 'Esperando la primera actualización automática de noticias…') + '</p>';
                return;
            }

            var h = noticias[0];
            destacada.innerHTML =
                '<a href="' + enlace(h) + '" class="hero-card">' +
                    '<img src="' + e(Pulso.imagenDe(h)) + '" alt="' + e(h.titulo) + '" referrerpolicy="no-referrer">' +
                    '<div class="cuerpo"><span class="etiqueta">Destacado</span> ' + etiqueta(h) +
                    '<h2>' + e(h.titulo) + '</h2><p>' + e(Pulso.soloTexto(h.resumen)) + '</p></div></a>';

            cuadricula.innerHTML = noticias.slice(1).map(function (n) {
                return '<a href="' + enlace(n) + '" class="news-card">' +
                    '<img src="' + e(Pulso.imagenDe(n)) + '" alt="' + e(n.titulo) + '" loading="lazy" referrerpolicy="no-referrer">' +
                    '<div class="cuerpo">' + etiqueta(n) + '<span class="fecha">' + e(Pulso.fechaBonita(n.fecha)) + '</span>' +
                    '<h3>' + e(n.titulo) + '</h3></div></a>';
            }).join('');
        }

        document.querySelectorAll('.pestanas button').forEach(function (b) {
            b.addEventListener('click', function () {
                var s = b.getAttribute('data-seccion');
                history.replaceState(null, '', s === 'todas' ? location.pathname : '#' + s);
                pintar();
            });
        });
        window.addEventListener('hashchange', pintar);

        Pulso.cargarNoticias().then(function (lista) {
            todas = lista.slice().reverse();
            document.getElementById('ahora-texto').textContent = todas.length ? todas[0].titulo : 'Pronto habrá noticias nuevas.';
            document.getElementById('lateral').innerHTML = todas.slice(0, 5).map(function (n) {
                return '<a href="' + enlace(n) + '" class="item-lateral">' +
                    '<img src="' + e(Pulso.imagenDe(n)) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' +
                    '<div>' + etiqueta(n) + '<span class="fecha">' + e(Pulso.fechaBonita(n.fecha)) + '</span><h4>' + e(n.titulo) + '</h4></div></a>';
            }).join('');
            pintar();
        }).catch(function () {
            document.getElementById('destacada').innerHTML = '';
            document.getElementById('lista').innerHTML = '<p class="mensaje-vacio">No se pudieron cargar las noticias. Intenta de nuevo en un momento.</p>';
        });
    </script>
</body>
</html>
